name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package
        run: |
          ./scripts/build-app.sh
          ./scripts/package-release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/LaunchScope.zip dist/LaunchScope.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/LaunchScope.zip dist/LaunchScope.zip.sha256 \
              --generate-notes --title "LaunchScope $GITHUB_REF_NAME"
          fi
